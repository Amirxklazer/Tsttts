name: Build Ilot14 World (Switch NRO)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219   # pinned on purpose, do not use :latest
    steps:
      - uses: actions/checkout@v4

      - name: Make sure SDL2 for Switch is present
        run: |
          if [ ! -x "$DEVKITPRO/portlibs/switch/bin/sdl2-config" ]; then
            dkp-pacman -Sy --noconfirm switch-sdl2
          fi
          "$DEVKITPRO/portlibs/switch/bin/sdl2-config" --version

      - name: Build
        run: make -j"$(nproc)"

      - name: Check output
        run: ls -l Ilot14.nro

      - uses: actions/upload-artifact@v4
        with:
          name: Ilot14-World-nro
          path: Ilot14.nro
          if-no-files-found: error
